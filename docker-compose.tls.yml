# 可选：仅当宿主机的 80/443 空闲时，用 Caddy 自动申请证书。
#   docker compose -f docker-compose.yml -f docker-compose.tls.yml up -d
# NAS 的 80/443 已被占用时不要使用本文件，改用现有反向代理。
services:
  caddy:
    image: caddy:2.9
    container_name: shengce-caddy
    restart: unless-stopped
    depends_on:
      - shengce
    environment:
      DOMAIN: "record.example.com"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
