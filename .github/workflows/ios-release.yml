name: iOS Release

on:
  push:
    tags:
      - 'ios-v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify package
        run: |
          test -f ios/packages/*.deb
          sha256sum ios/packages/*.deb

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: ios/packages/*.deb
          generate_release_notes: true
