# 最简单、最常用的安装方式：拉取预构建镜像，只占用宿主机的 3000 端口。
# 先修改下面的 ADMIN_PASSWORD / DAV_PASSWORD，再执行：
#   docker compose up -d
services:
  shengce:
    container_name: shengce
    image: ghcr.io/ay-cc-coder/shengce:latest
    restart: unless-stopped

    ports:
      - "3000:8080"

    volumes:
      - ./data:/data

    environment:
      TZ: Asia/Shanghai
      ADMIN_PASSWORD: "change-me"
      DAV_USERNAME: audiowatch
      DAV_PASSWORD: "change-me"
      WHISPER_MODEL: small
      WHISPER_CPU_THREADS: "2"
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
      START_WORKER: "1"
      DEMO_MODE: "0"

    # 防止转写把 NAS 的 CPU/内存吃满。按你的 NAS 配置调整。
    cpus: "2.0"
    mem_limit: "3g"
    mem_reservation: "768m"
    pids_limit: 256
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
